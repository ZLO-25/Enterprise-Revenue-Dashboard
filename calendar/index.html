<style>
/* Layout: report column (max 1180px) — sticky section nav, KPI strip, then one section per metric family; charts sit two-up on wide screens, one-up on phones. */
:root {
  --page: #f3f3ef;
  --surface: #fcfcfb;
  --ink: #121211;

  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --neg: #e34948;
  --pos-soft: #86b6ef;
  --n7: #86b6ef; --n5: #3987e5; --n3: #1c5cab; --n2: #0d366b;
  --good-text: #006300;
  --bad-text: #b42f2f;
  --chip-bg: #e8f0fb; --chip-ink: #184f95;
  --font-ui: "IBM Plex Sans", "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-cjk: "Noto Sans TC", "IBM Plex Sans", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --step-0: 0.875rem; --step-1: 1rem; --step-2: 1.25rem; --step-3: 1.6rem; --step-4: 2.2rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0f0f0e; --surface: #1a1a19; --ink: #f6f6f3; --ink-2: #c3c2b7; --muted: #a3a197; --tick: #8f8d85;
    --grid: #2c2c2a; --axis: #3d3d3a; --line: rgba(255, 255, 255, 0.10); --wash: rgba(57, 135, 229, 0.12);
    --accent: #6da7ec;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --neg: #e66767; --pos-soft: #5598e7;
    --n7: #184f95; --n5: #2a78d6; --n3: #6da7ec; --n2: #b7d3f6;
    --good-text: #3fbf3f; --bad-text: #f08080;
    --chip-bg: #16304f; --chip-ink: #b7d3f6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0f0f0e; --surface: #1a1a19; --ink: #f6f6f3; --ink-2: #c3c2b7; --muted: #a3a197; --tick: #8f8d85;
  --grid: #2c2c2a; --axis: #3d3d3a; --line: rgba(255, 255, 255, 0.10); --wash: rgba(57, 135, 229, 0.12);
  --accent: #6da7ec;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --neg: #e66767; --pos-soft: #5598e7;
  --n7: #184f95; --n5: #2a78d6; --n3: #6da7ec; --n2: #b7d3f6;
  --good-text: #3fbf3f; --bad-text: #f08080;
  --chip-bg: #16304f; --chip-ink: #b7d3f6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {

  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--step-1);
  line-height: 1.6;
  padding-inline: 16px;
  padding-block: 0 48px;
}
.wrap { max-width: 1180px; margin-inline: auto; display: grid; gap: 40px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.25; font-family: var(--font-ui); }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* header */
.masthead { display: grid; gap: 14px; padding-top: 28px; }
.eyebrow { font-family: var(--font-data); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.masthead h1 { font-size: var(--step-4); font-weight: 700; letter-spacing: -0.01em; }
.masthead h1 .code { font-family: var(--font-data); font-weight: 500; font-size: 0.55em; color: var(--muted); letter-spacing: 0; margin-left: 0.4em; vertical-align: 0.2em; }
.lede { color: var(--ink-2); max-width: 68ch; }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: var(--step-0); color: var(--muted); font-family: var(--font-data); }
.meta-row b { color: var(--ink); font-weight: 500; }

/* nav */
.secnav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--page); border-bottom: 1px solid var(--line); margin-inline: -16px; padding-inline: 16px; }
.secnav .scroller { max-width: 1180px; margin-inline: auto; display: flex; gap: 4px; overflow-x: auto; padding-block: 8px; scrollbar-width: none; }
.secnav .scroller::-webkit-scrollbar { display: none; }
.secnav a { flex: none; text-decoration: none; color: var(--ink-2); font-size: var(--step-0); padding: 6px 12px; border-radius: 999px; }
.secnav a:hover { background: var(--wash); color: var(--ink); }
.secnav a.on { background: var(--chip-bg); color: var(--chip-ink); }
/* 公司頁：寬螢幕（≥1200px）把章節目錄從頂端橫條改成右側固定欄。
   左邊留給全站側邊欄（App Shell），右邊放「本頁章節」，兩者不打架：
   ┌────────┬──────────────────────────┬──────────┐
   │ 全站選單 │ 內容（圖表、表格）           │ 本頁章節   │
   │ (可收合) │                          │ 跟著畫面   │
   └────────┴──────────────────────────┴──────────┘
   窄螢幕維持原本的頂端橫條。 */
@media (min-width: 1200px) {
  .pg { display: grid; grid-template-columns: minmax(0, 1fr) 168px; column-gap: 40px; max-width: 1320px; margin-inline: auto; }
  .pg > .wrap { grid-column: 1; grid-row: 1; max-width: none; margin: 0; min-width: 0; }
  .pg > .secnav { grid-column: 2; grid-row: 1; align-self: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px);
    margin: 32px 0 0; padding: 0; border: 0; background: none; max-height: calc(100vh - 40px); overflow-y: auto; scrollbar-width: thin; }
  .pg > .secnav .scroller { display: grid; gap: 1px; padding: 0; overflow: visible; border-left: 1px solid var(--line); }
  .pg > .secnav .scroller::before { content: "本頁章節"; padding: 0 0 8px 14px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; color: var(--muted); }
  .pg > .secnav a { margin-left: -1px; padding: 5px 10px 5px 13px; border-left: 2px solid transparent; border-radius: 0 6px 6px 0; font-size: 0.86rem; line-height: 1.35; }
  .pg > .secnav a.homelink { margin-bottom: 6px; }
  .pg > .secnav a.on { border-left-color: var(--accent); background: var(--wash); color: var(--ink); font-weight: 600; }
  .pg section { scroll-margin-top: 20px; }
}
/* ≥1280px 且全站側邊欄收合時，左上角有一顆浮動的 ☰ 按鈕：內容左邊至少留 56px，不被它蓋住 */
@media (min-width: 1280px) { html.sb-push:not(.sb-open) .pg { padding-left: max(0px, calc(40px - (100vw - 1352px) / 2)); } }

/* cadence strip */
.cadence { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.cadence > div { padding: 14px 16px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.cadence > div + div { border-left: 1px solid var(--line); }
.cadence .when { font-family: var(--font-data); font-size: 0.75rem; color: var(--muted); letter-spacing: 0.04em; }
.cadence .what { font-weight: 600; }
.cadence .which { font-size: var(--step-0); color: var(--ink-2); }
@media (max-width: 720px) {
  .cadence { grid-template-columns: minmax(0, 1fr); }
  .cadence > div + div { border-left: 0; border-top: 1px solid var(--line); }
}

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 620px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi:last-child { grid-column: 1 / -1; } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.kpi .label { font-size: 0.8rem; color: var(--muted); }
.kpi .value { font-size: var(--step-3); font-weight: 600; letter-spacing: -0.01em; line-height: 1.1; }
.kpi .value small { font-size: 0.55em; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
.kpi .delta { font-size: 0.8rem; color: var(--ink-2); font-family: var(--font-data); }
.up { color: var(--good-text); }
.down { color: var(--bad-text); }
.chip { justify-self: start; font-size: 0.7rem; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: var(--chip-bg); color: var(--chip-ink); }

/* sections */
section { display: grid; gap: 18px; scroll-margin-top: 64px; }
.sec-head { display: grid; gap: 6px; }
.sec-head h2 { font-size: var(--step-3); font-weight: 700; }
.sec-head .sub { color: var(--ink-2); max-width: 72ch; font-size: 0.95rem; }
.sec-tag { font-family: var(--font-data); font-size: 0.72rem; color: var(--muted); letter-spacing: 0.06em; }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.card.wide { grid-column: 1 / -1; }
.card h3 { font-size: 1.02rem; font-weight: 600; }
.card .how { font-size: 0.88rem; color: var(--ink-2); }
.card .how b { color: var(--ink); font-weight: 600; }
.chartbox { position: relative; height: 300px; width: 100%; }
.chartbox.short { height: 190px; }
.chartbox.tall { height: 340px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.legend i.ln { height: 3px; border-radius: 2px; width: 16px; }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls .lab { font-size: 0.8rem; color: var(--muted); margin-right: 4px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-size: 0.82rem; border: 0; background: transparent; color: var(--ink-2); padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--chip-bg); color: var(--chip-ink); font-weight: 600; }
.seg button:hover { color: var(--ink); }

/* waterfall */
.wf { display: grid; gap: 6px; }
.wf-row { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr) 7.5rem; gap: 12px; align-items: center; font-size: 0.86rem; }
.wf-row .nm { color: var(--ink-2); min-width: 0; }
.wf-row.total .nm { color: var(--ink); font-weight: 600; }
.wf-track { position: relative; height: 18px; }
.wf-track::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 1px solid var(--axis); }
.wf-bar { position: absolute; top: 2px; bottom: 2px; border-radius: 3px; }
.wf-row .v { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; color: var(--ink); font-size: 0.8rem; }
.wf-row .v em { font-style: normal; color: var(--muted); display: block; font-size: 0.72rem; }
@media (max-width: 560px) {
  .wf-row { grid-template-columns: minmax(0, 1fr) 6.5rem; }
  .wf-row .wf-track { grid-column: 1 / -1; grid-row: 2; }
}

/* notes */
.note { font-size: 0.86rem; color: var(--ink-2); border-left: 2px solid var(--axis); padding-left: 12px; }
.callout { background: var(--wash); border-radius: 10px; padding: 14px 16px; font-size: 0.9rem; color: var(--ink-2); display: grid; gap: 6px; }
.callout b { color: var(--ink); }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
th { font-weight: 600; color: var(--ink-2); background: var(--surface); position: sticky; top: 0; font-family: var(--font-cjk); }
td { font-family: var(--font-data); color: var(--ink); }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
tr:last-child td { border-bottom: 0; }
td .y { display: block; font-size: 0.68rem; }
td.tot { font-weight: 500; background: var(--wash); }
.tbl-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.btn { font: inherit; font-size: 0.82rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.btn:hover { background: var(--wash); }
.copied { font-size: 0.8rem; color: var(--good-text); }

/* glossary */
.gloss { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
@media (max-width: 760px) { .gloss { grid-template-columns: minmax(0, 1fr); } }
.gloss { margin: 0; }
.gloss .item { padding-block: 12px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.gloss dt { font-weight: 600; }
.gloss dt code { font-family: var(--font-data); font-size: 0.78rem; color: var(--muted); font-weight: 400; margin-left: 6px; }
.gloss dd { margin: 0; font-size: 0.9rem; color: var(--ink-2); }
.gloss dd .f { font-family: var(--font-data); font-size: 0.8rem; color: var(--ink); background: var(--wash); padding: 1px 6px; border-radius: 4px; }

.sources { font-size: 0.86rem; color: var(--ink-2); display: grid; gap: 8px; }
.sources ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
footer { font-size: 0.78rem; color: var(--muted); }

/* timelines */
.gantt-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 8px 12px 4px; }
.gantt { min-width: 780px; display: grid; }
.g-row { display: grid; grid-template-columns: 12.5rem minmax(0, 1fr); gap: 12px; align-items: center; min-height: 38px; border-bottom: 1px solid var(--grid); }
.g-row:last-child { border-bottom: 0; }
.g-row .nm { font-size: 0.84rem; line-height: 1.3; min-width: 0; }
.g-row .nm small { display: block; color: var(--muted); font-size: 0.7rem; }
.g-track { position: relative; height: 28px; }
.g-axis .g-track { height: 22px; }
.g-tick { position: absolute; top: 2px; transform: translateX(-50%); font-family: var(--font-data); font-size: 0.7rem; color: var(--tick); }
.g-grid { position: absolute; top: -6px; bottom: -6px; border-left: 1px solid var(--grid); }
.g-today { position: absolute; top: -6px; bottom: -6px; border-left: 1.5px dashed var(--s8); }
.g-line { position: absolute; top: 13px; height: 2px; background: var(--axis); }
.g-line.plan { background: repeating-linear-gradient(90deg, var(--axis) 0 4px, transparent 4px 8px); }
.g-mk { position: absolute; top: 7px; width: 14px; height: 14px; margin-left: -7px; background: var(--c); border: 2px solid var(--c); cursor: pointer; padding: 0; }
.g-mk.plan { background: var(--surface); }
.g-mk.k-a { transform: rotate(45deg) scale(0.82); }
.g-mk.k-g { border-radius: 2px; }
.g-mk.k-c { clip-path: polygon(50% 0, 100% 100%, 0 100%); border: 0; }
.g-mk.k-c.plan { opacity: 0.45; }
.g-mk.k-m { border-radius: 50%; }
.g-mk.unc { border-style: dashed; background: var(--surface); opacity: 0.8; }
.g-mk.k-c.unc { opacity: 0.35; }
.unc-chip { display: inline-block; font-size: 0.68rem; font-weight: 600; padding: 0 6px; margin-left: 6px; border-radius: 999px; border: 1px dashed var(--s4); color: var(--ink-2); vertical-align: 1px; white-space: nowrap; }
.g-mk:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.g-info { font-size: 0.86rem; color: var(--ink-2); min-height: 1.6em; }
.g-info b { color: var(--ink); }
.g-key { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.8rem; color: var(--ink-2); align-items: center; }
.g-key span { display: inline-flex; align-items: center; gap: 6px; }
.g-key .g-mk { position: static; margin: 0; cursor: default; }
.st-plan { color: var(--muted); }
td.txt, th.txt { text-align: left; white-space: normal; min-width: 16rem; font-family: var(--font-cjk); }
td.src a { font-family: var(--font-cjk); font-size: 0.75rem; }

/* shared site chrome */
.homelink { font-weight: 600; color: var(--accent) !important; }
.disclaimer { font-size: 0.78rem; color: var(--muted); margin-top: 6px; }

/* long-term view + freshness (assets/longterm.js) */
.lt-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .lt-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .lt-grid { grid-template-columns: minmax(0, 1fr); } }
.kpi.lt { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "label label" "value spark" "delta delta" "chip chip"; align-items: end; }
.kpi.lt .label { grid-area: label; } .kpi.lt .value { grid-area: value; } .kpi.lt .delta { grid-area: delta; } .kpi.lt .chip { grid-area: chip; }
.kpi.lt .spark { grid-area: spark; justify-self: end; overflow: visible; }
.lt-how { font-size: 0.88rem; color: var(--ink-2); max-width: 80ch; }
.lt-how b { color: var(--ink); }
.fresh { display: inline-block; font-family: var(--font-data); font-size: 0.72rem; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); vertical-align: middle; }
.fresh-fresh { color: var(--good-text); border-color: color-mix(in srgb, var(--good-text) 40%, transparent); }
.fresh-aging { color: #9a6700; border-color: rgba(154, 103, 0, 0.4); }
.fresh-overdue { color: var(--bad-text); border-color: color-mix(in srgb, var(--bad-text) 40%, transparent); }
.disclaimer-box { font-size: 0.8rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; max-width: 90ch; line-height: 1.6; }

/* 指數期貨（assets/futures.js）：K 棒用台灣習慣，紅漲綠跌 */
:root { --kup: #d23a3a; --kdn: #138a52; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --kup: #f06a6a; --kdn: #2fbf7f; } }
:root[data-theme="dark"] { --kup: #f06a6a; --kdn: #2fbf7f; }

<script>
/* 首頁「今天該看什麼」與財報行事曆頁共用的純函式（不碰 DOM，Node 也能測：node --test tools/tests/today.test.js）。
   日期一律用台北日期（YYYY-MM-DD 字串比較）。事件資料來自各公司 events[]；系統紅燈、燈號變化、估值訊號是三個小檔，讀不到就略過那一類。 */
const EVCAL = (() => {
  const addDays = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
  const tpeDate = (now) => new Date((now || new Date()).getTime() + 8 * 3600e3).toISOString().slice(0, 10);
  const dow = (d) => new Date(d + 'T00:00:00Z').getUTCDay();          // 0=週日
  const monday = (d) => addDays(d, -((dow(d) + 6) % 7));
  const WD = ['日', '一', '二', '三', '四', '五', '六'];
  const md = (d) => d.slice(5).replace('-', '/');
  const mdw = (d) => md(d) + ' 週' + WD[dow(d)];
  const days = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400e3);

  /* events: [{d, code, name, t, est}]；回傳排序後（日期、已公告在前） */
  const sortEv = (evs) => evs.slice().sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : (!!a.est - !!b.est) || (a.code < b.code ? -1 : 1));

  /* 首頁：最多 limit 則，優先順序固定。回傳 {items:[{kind,text,href}], more} */
  function pick(o) {
    const today = o.today, limit = o.limit || 3, items = [];
    if (o.alerts && o.alerts.length) items.push({ kind: 'alert', text: '系統有 ' + o.alerts.length + ' 個紅燈：' + o.alerts.slice(0, 2).join('；') + (o.alerts.length > 2 ? '…' : ''), href: o.statusHref });
    const ev = sortEv(o.events || []);
    const fmt = (e) => (e.d === today ? '今天' : mdw(e.d)) + ' ' + e.name + ' ' + e.t + (e.est ? '（預估）' : '（已公告）');
    ev.filter(e => e.d === today).forEach(e => items.push({ kind: 'event', text: fmt(e), href: e.href }));
    const week = ev.filter(e => e.d > today && e.d <= addDays(today, 7));
    week.filter(e => !e.est).concat(week.filter(e => e.est)).forEach(e => items.push({ kind: 'event', text: fmt(e), href: e.href }));
    const cut = addDays(today, -7);
    (o.lights || []).filter(c => c.d >= cut && c.g !== 'val' && (c.to === 'y' || c.to === 'r')).forEach(c =>
      items.push({ kind: 'light', text: '體質燈號轉' + (c.to === 'r' ? '紅' : '黃') + '：' + (c.cname || c.code.toUpperCase()) + ' ' + (c.name || c.k) + '（' + md(c.d) + '）', href: c.href }));
    (o.signals || []).filter(s => s.d >= cut).forEach(s =>
      items.push({ kind: 'signal', text: '估值' + (s.kind === 'exceed' ? '超出' : '回到') + '門檻：' + (s.cname || s.code.toUpperCase()) + ' ' + s.name + ' ' + s.now + '（' + md(s.d) + '）· 提醒，不是買賣建議', href: s.href }));
    return { items: items.slice(0, limit), more: Math.max(0, items.length - limit) };
  }

  /* 行事曆：依週一起算分組。回傳 [{start, end, label, items}]；沒有事件的連續週合併成一筆 empty:true */
  function weeks(evs, today, span) {
    const last = addDays(today, span || 90), out = [];
    const inRange = sortEv(evs).filter(e => e.d >= today && e.d <= last);
    let w = monday(today), emptyFrom = null;
    const flush = (to) => { if (emptyFrom) { out.push({ start: emptyFrom, end: to, empty: true, items: [] }); emptyFrom = null; } };
    for (; w <= last; w = addDays(w, 7)) {
      const end = addDays(w, 6), items = inRange.filter(e => e.d >= w && e.d <= end);
      if (!items.length) { if (!emptyFrom) emptyFrom = w; continue; }
      flush(addDays(w, -1));
      out.push({ start: w, end, items });
    }
    flush(addDays(w, -1));
    return out;
  }

  /* .ics：只含「已公告」事件，全天事件 */
  function ics(evs) {
    const esc = (s) => String(s).replace(/([,;\\])/g, '\\$1');
    const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Enterprise Revenue Dashboard//TW', 'CALSCALE:GREGORIAN'];
    evs.filter(e => !e.est).forEach(e => {
      const d = e.d.replace(/-/g, '');
      L.push('BEGIN:VEVENT', 'UID:' + e.code + '-' + d + '@erd', 'DTSTAMP:' + d + 'T000000Z', 'DTSTART;VALUE=DATE:' + d, 'DTEND;VALUE=DATE:' + addDays(e.d, 1).replace(/-/g, ''), 'SUMMARY:' + esc(e.name + ' ' + e.t), 'END:VEVENT');
    });
    L.push('END:VCALENDAR');
    return L.join('\r\n');
  }
  return { addDays, tpeDate, dow, monday, md, mdw, days, sortEv, pick, weeks, ics };
})();
if (typeof module !== 'undefined') module.exports = EVCAL;
