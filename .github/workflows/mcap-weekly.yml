# 市值排名每週更新（不經過 Claude）：每週六台北清晨，美股週五收盤之後
#
#   ① 台北週六 05:37 ～ 13:07 排了 6 班，週日 09:07、15:07 再補 2 班（GitHub 免費排程常漏跑，所以多排幾班）
#   ② 每班先確認「這週六抓過了沒」：抓過 → 約 10 秒結束，不抓
#   ③ 沒抓過才抓：companiesmarketcap（主）＋ Yahoo／CoinGecko／WGC（核對）→ data/mcap/latest.json
#   ④ 抓失敗：不覆蓋舊檔、這次標紅燈（GitHub 會寄信）；下一班再試
#   ⑤ 抓完（或週日最後一班仍沒抓到）就自己跑 tools/mcap_check.py：結果寫在這次執行的 Summary；
#      有 ✗ 或需要更新黃金地上存量 → 開一個 GitHub issue（GitHub 會寄信），正常就不打擾。
#   不再需要 Claude 每週檢查（docs/MCAP_WEEKLY_PROMPT.md 只在 issue 出現時照著處理）。
name: mcap-weekly
on:
  schedule:
    - cron: "37 21 * * 5"          # 台北週六 05:37
    - cron: "7,37 22 * * 5"        # 台北週六 06:07、06:37
    - cron: "7 23 * * 5"           # 台北週六 07:07（備援）
    - cron: "7 1 * * 6"            # 台北週六 09:07（備援）
    - cron: "7 5 * * 6"            # 台北週六 13:07（備援）
    - cron: "7 1 * * 0"            # 台北週日 09:07（週六全部失敗時的備援；已抓過只空跑約 10 秒）
    - cron: "7 7 * * 0"            # 台北週日 15:07（同上）
  workflow_dispatch:
    inputs:
      force:
        description: "就算這週抓過也重抓"
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: mcap-weekly
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 確認這週是否已抓過
        id: chk
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then echo "stale=true" >> "$GITHUB_OUTPUT"; else python3 tools/mcap_fetch.py --check; fi
      - uses: actions/setup-python@v5
        if: steps.chk.outputs.stale == 'true'
        with:
          python-version: "3.12"
      - name: 安裝套件
        if: steps.chk.outputs.stale == 'true'
        run: pip install --quiet yfinance
      - name: 抓資料、核對、寫檔
        id: fetch
        if: steps.chk.outputs.stale == 'true'
        run: python3 tools/mcap_fetch.py
      - name: 有新資料才提交
        if: steps.chk.outputs.stale == 'true'
        run: |
          git config user.name "mcap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mcap
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "市值排名每週更新 $(TZ=Asia/Taipei date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break || sleep 5; done
      - name: 檢查結果（正常寫 Summary；有問題開 issue）
        if: always() && ((steps.chk.outputs.stale == 'true' && steps.fetch.outcome == 'success') || github.event.schedule == '7 7 * * 0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull -q origin "${GITHUB_REF_NAME}" || true
          set +e
          python3 tools/mcap_check.py > check.txt; code=$?
          set -e
          { echo "## 市值排名每週檢查 $(TZ=Asia/Taipei date +%Y-%m-%d)"; echo '```'; cat check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          need=""
          if [ "$code" != "0" ]; then need="有問題"; fi
          if grep -q "黃金地上存量" check.txt; then need="${need:+$need、}黃金地上存量可能要更新"; fi
          if [ -z "$need" ]; then echo "正常"; exit 0; fi
          title="市值排名每週檢查：${need}"
          if gh issue list --state open --search "in:title 市值排名每週檢查" --json number --jq '.[0].number' | grep -q .; then
            n=$(gh issue list --state open --search "in:title 市值排名每週檢查" --json number --jq '.[0].number')
            gh issue comment "$n" --body-file check.txt
          else
            { echo "Actions 的 mcap_check.py 結果（${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}）："; echo; echo '```'; cat check.txt; echo '```'; echo; echo "處理方式：請 Claude 照 docs/MCAP_WEEKLY_PROMPT.md 的「有問題時」與第 5 步處理，處理完關閉這個 issue。"; } > body.md
            gh issue create --title "$title" --body-file body.md
          fi
