name: probe-net
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://www.twse.com.tw/exchangeReport/STOCK_DAY?response=json&date=20261001&stockNo=2330" | head -c 700; echo
          curl -s "https://www.twse.com.tw/exchangeReport/BWIBBU?response=json&date=20261030&stockNo=2330" | head -c 700; echo
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install -q yfinance
          python - <<'P'
          import yfinance as yf, datetime as dt
          for s in ["AAPL","MSFT","NVDA","MU","TSLA","PLTR","ANET","AMZN","SPCX","2330.TW","2308.TW","005930.KS"]:
              try:
                  t=yf.Ticker(s)
                  ed=t.get_earnings_dates(limit=120)
                  idx=sorted(ed.index) if ed is not None else []
                  print(s,"earn dates",len(idx), str(idx[0])[:10] if idx else None, str(idx[-1])[:10] if idx else None)
                  i=t.info
                  print(s,{k:(dt.datetime.utcfromtimestamp(i[k]).date().isoformat() if k in i and i[k] else None) for k in ("lastFiscalYearEnd","nextFiscalYearEnd","mostRecentQuarter")})
                  print(t.earnings_estimate.to_string())
              except Exception as ex: print(s,"ERR",repr(ex)[:300])
          P
