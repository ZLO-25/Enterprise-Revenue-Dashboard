name: probe13f
on:
  push:
    branches: [13f-holdings]
    paths: [tools/probe/**]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/f13_fetch.py 2>&1 | tee tools/probe/fetch.log || true
      - run: set +e; python3 tools/f13_check.py > tools/probe/check.txt 2>&1; echo "exit=$?" >> tools/probe/check.txt; cat tools/probe/check.txt
      - run: |
          git config user.name probe; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/probe data/13f; git commit -m "probe result"; git push origin HEAD:13f-holdings
