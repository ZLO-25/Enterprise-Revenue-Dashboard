# 一次性探測：Actions 讀不讀得到 SEC 新申報清單、免費來源有沒有當季預估（確認後可刪除）
name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: SEC submissions
        run: |
          curl -sS -A "Enterprise-Revenue-Dashboard research contact@example.com" -o /tmp/s.json -w "submissions http=%{http_code} size=%{size_download}\n" https://data.sec.gov/submissions/CIK0001045810.json
          python3 -c "
          import json;d=json.load(open('/tmp/s.json'));r=d['filings']['recent']
          for i in range(8): print(r['form'][i],r['filingDate'][i],r['items'][i],r['accessionNumber'][i])"
          curl -sS -A "Enterprise-Revenue-Dashboard research contact@example.com" -o /tmp/c.json -w "concept http=%{http_code} size=%{size_download}\n" https://data.sec.gov/api/xbrl/companyconcept/CIK0001045810/us-gaap/StockholdersEquity.json
      - name: Yahoo quarterly estimate
        run: |
          pip install --quiet yfinance
          python3 -c "
          import yfinance as yf
          for s in ['NVDA','AAPL','2330.TW']:
              t=yf.Ticker(s)
              try: print(s,'EPS\n',t.earnings_estimate); print('REV\n',t.revenue_estimate)
              except Exception as e: print(s,'ERR',e)"
