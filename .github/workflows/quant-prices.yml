# 量化回測（單筆 vs 定期定額）的價格資料：每個平日自動更新（不經過 Claude，也不碰財報資料）
#
#   觸發：① 每個平日台北 06:30（美股收盤後）② 「⚙️ 管理標的」改了 quant/tickers.json ③ 手動
#   流程：校正規則單元測試 → yfinance 下載 → 只寫 quant/data/ → 有變動才提交
#   某檔抓不到 → 沿用上次的資料（fetch_data.py 內建）；全部失敗 → 紅燈
#   只會 git add quant/data，不會動到其他任何檔案。
name: quant-prices
on:
  schedule:
    - cron: "30 22 * * 1-5"     # UTC 22:30 = 台北 06:30（週二～週六早上）
  push:
    paths:
      - "quant/tickers.json"
      - "quant/scripts/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quant-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: quant/scripts/requirements.txt
      - run: pip install -r quant/scripts/requirements.txt
      - name: 單元測試（台股資料校正規則）
        run: python -m unittest discover -s quant/tests -p 'test_*.py'
      - name: 下載最新價格
        run: python quant/scripts/fetch_data.py
      - name: 有變動才提交
        run: |
          git config user.name "quant-prices-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quant/data
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -q -m "量化回測價格自動更新 $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "推送失敗（可能別的排程剛好也在推），第 $i 次重試"; sleep 15
          done
          exit 1
