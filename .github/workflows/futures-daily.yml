# 小道瓊、小那指期貨日 K 每日更新（不經過 Claude）
# CME 收盤：芝加哥 16:00 = UTC 21:00（美國夏令）／22:00（冬令）。
# 盤後跑三次，前一次成功、沒有新 K 棒時，後面幾次什麼都不做：
#   UTC 23:17 週一～五 = 台北 07:17 週二～六（冬令收盤後約 1.3 小時，夏令約 2.3 小時）
#   UTC 01:47、04:17 週二～六 = 台北 09:47、12:17（備援：GitHub 排程常延遲或漏跑）
# 分鐘刻意避開整點與半點（整點排程最擁擠、最容易被延遲）。
# 密碼放在 Settings → Secrets and variables → Actions → FUTURES_PASSWORD。
name: futures-daily
on:
  schedule:
    - cron: "17 23 * * 1-5"
    - cron: "47 1 * * 2-6"
    - cron: "17 4 * * 2-6"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: futures-daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet cryptography yfinance
      - name: 抓資料、核對、加密
        env:
          FUTURES_PASSWORD: ${{ secrets.FUTURES_PASSWORD }}
        run: python3 tools/futures_update.py
      - name: 有新資料才提交
        run: |
          git config user.name "futures-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/futures
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "期貨日 K 自動更新 $(date -u +%Y-%m-%d)"
          git push
