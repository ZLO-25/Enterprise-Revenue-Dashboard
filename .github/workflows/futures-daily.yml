# 小道瓊、小那指期貨日 K 每日更新（不經過 Claude）
# 台北 08:30 與 10:30（UTC 00:30、02:30），週二到週六；美國收盤後約 2.5 小時。
# 密碼放在 Settings → Secrets and variables → Actions → FUTURES_PASSWORD。
name: futures-daily
on:
  schedule:
    - cron: "30 0 * * 2-6"
    - cron: "30 2 * * 2-6"
  workflow_dispatch:
  push:
    branches: [futures-kbar]
    paths: [tools/futures_update.py, .github/workflows/futures-daily.yml]
permissions:
  contents: write
concurrency:
  group: futures-daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet cryptography
      - name: 抓資料、核對、加密（開發分支：改用開發公鑰）
        if: github.ref == 'refs/heads/futures-kbar'
        run: python3 tools/futures_update.py --dev-pubkey tools/dev_pubkey.pem
      - name: 抓資料、核對、加密
        if: github.ref != 'refs/heads/futures-kbar'
        env:
          FUTURES_PASSWORD: ${{ secrets.FUTURES_PASSWORD }}
        run: python3 tools/futures_update.py
      - name: 有新資料才提交
        run: |
          git config user.name "futures-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/futures data/futures-dev 2>/dev/null || true
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "期貨日 K 自動更新 $(date -u +%Y-%m-%d)"
          git push
