# 小道瓊、小那指期貨日 K 每日更新（不經過 Claude）
#
# 確認 + 重試機制：
#   ① 每小時的 17 分都會醒來一次（台北 07:17 ～ 17:17，週二～六）。GitHub 免費排程偶爾會漏跑，
#      班次多，漏掉一兩班也沒關係。
#   ② 每次先「確認」：網站上的資料是否已經到最新交易日（跳過週末、美國假日）。
#      已是最新 → 約 10 秒就結束，不抓資料。
#   ③ 落後才抓 Yahoo；抓完再確認一次。還沒到最新 → 同一班內等 10 分鐘再試，最多 3 次。
#   ④ 台北 17:17 最後一班仍失敗 → 這次執行標成紅燈，GitHub 會寄信通知你。
# CME 收盤：芝加哥 16:00 = UTC 21:00（美國夏令）／22:00（冬令），第一班在收盤後 1～2 小時。
# 密碼放在 Settings → Secrets and variables → Actions → FUTURES_PASSWORD。
name: futures-daily
on:
  schedule:
    - cron: "17 23 * * 1-5"     # 台北 07:17（週二～六）
    - cron: "17 0-9 * * 2-6"    # 台北 08:17 ～ 17:17
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: futures-daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 確認資料是否已是最新
        id: chk
        run: python3 tools/futures_update.py --check
      - uses: actions/setup-python@v5
        if: steps.chk.outputs.stale == 'true'
        with:
          python-version: "3.12"
      - name: 安裝套件
        if: steps.chk.outputs.stale == 'true'
        run: pip install --quiet cryptography yfinance
      - name: 抓資料、核對、加密（還沒到最新就等 10 分鐘重試，最多 3 次）
        if: steps.chk.outputs.stale == 'true'
        env:
          FUTURES_PASSWORD: ${{ secrets.FUTURES_PASSWORD }}
        run: |
          H=$(date -u +%H)
          for i in 1 2 3; do
            # 台北 17:17 那一班（UTC 09 點）的最後一次嘗試：失敗就讓這次執行變紅燈
            if [ "$H" = "09" ] && [ "$i" = "3" ]; then export FINAL_TRY=1; fi
            set +e; python3 tools/futures_update.py; rc=$?; set -e
            if [ $rc -eq 0 ]; then echo "✓ 確認已更新到最新"; exit 0; fi
            if [ $rc -ne 75 ]; then exit $rc; fi
            if [ $i -lt 3 ]; then echo "第 $i 次還沒到最新，10 分鐘後重試"; sleep 600; fi
          done
          echo "這一班 3 次都還沒到最新，交給下一班（每小時 17 分）"
      - name: 有新資料才提交
        if: steps.chk.outputs.stale == 'true'
        run: |
          git config user.name "futures-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/futures
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "期貨日 K 自動更新 $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin main
          git push
