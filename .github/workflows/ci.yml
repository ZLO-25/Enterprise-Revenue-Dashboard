# PR 自動檢查（不花 token）：資料核對、建置、單元測試、JavaScript 語法、瀏覽器冒煙測試。
# 規則：合併 PR 之前必須看到這個檢查是綠燈（見 CLAUDE.md）。
# 不檢查「網站檔案和 repo 一致」：每日收盤價會直接改 main 而不重建網站，這個比對會一直誤報。
name: ci
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 資料核對
        run: python3 tools/validate.py
      - name: 建置網站
        run: python3 tools/build.py
      - name: 公式固定測試案例
        run: |
          python3 tools/pe.py
          python3 tools/daily_calc.py
      - name: 單元測試（工具）
        run: |
          pip install --quiet cryptography   # test_kbar 要驗證加密後能解回；看盤頁瀏覽器測試的 fixture 也要用
          python3 -m unittest discover -s tools/tests
      - name: 單元測試（回測）
        run: |
          pip install --quiet -r quant/scripts/requirements.txt
          python3 -m unittest discover -s quant/tests -p 'test_*.py'
          node --test quant/tests/rates-core.test.mjs
          node --test quant/tests/view-mode.test.mjs
          node --test quant/tests/engine-phase2.test.mjs
          node --test tools/tests/today.test.js
      - name: JavaScript 語法檢查
        run: for f in assets/*.js quant/js/*.js; do node --check "$f" || exit 1; done
      - name: 瀏覽器冒煙測試（首頁、個股頁、市值排名、系統健康、量化回測 #dca／#monthly／#vol）
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 tools/smoke_test.py
      - name: 瀏覽器測試（看盤頁、個股頁 K 棒；合成資料，不碰 data/）
        run: |
          # 沿用上一步 Python Playwright 已經裝好的 chromium；測試腳本用 node 版 playwright 驅動它
          export PW_CHROMIUM="$(python3 -c 'from playwright.sync_api import sync_playwright as s; p = s().start(); print(p.chromium.executable_path); p.stop()')"
          # node 版 playwright 釘成跟 Python 版同一個 major.minor（同一版 chromium）；補丁版號兩邊不一定都有，所以用 ~X.Y.0；裝不到才退回不釘
          PW_MM="$(python3 -c 'import importlib.metadata as m; print(".".join(m.version("playwright").split(".")[:2]))')"
          npm install --no-save --prefix "$RUNNER_TEMP/pw" "playwright@~$PW_MM.0" || npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tools/tests/kbar_browser.cjs
